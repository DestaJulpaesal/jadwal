<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <title>Sedang offline · Jadwal Harian</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1d2925; background: #f7f8f5; }
        body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; padding: 1.5rem; place-items: center; }
        main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #dce4df; border-radius: 1rem; background: #fff; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { line-height: 1.6; color: #52615b; }
        a { display: inline-flex; min-height: 2.75rem; align-items: center; padding: 0 1rem; border-radius: .5rem; background: #226b50; color: #fff; font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid #174e3a; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>Kamu sedang offline</h1>
        <p>Data tersimpan di server aman. Sambungkan kembali ke internet, lalu coba buka halaman ini lagi.</p>
        <a href="/">Coba lagi</a>
    </main>
</body>
</html>
